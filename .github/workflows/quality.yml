name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Lint without warnings
        run: bun run lint
        timeout-minutes: 5
      - name: Unit and component tests
        run: bun test
        timeout-minutes: 5
      - name: Production build
        run: bun run build
        timeout-minutes: 10
      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      - name: Browser behavior and accessibility tests
        run: bun run test:e2e
        timeout-minutes: 30
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
