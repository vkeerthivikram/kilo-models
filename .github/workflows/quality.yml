name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Lint without warnings
        run: bun run lint
      - name: Unit and component tests
        run: bun test
      - name: Production build
        run: bun run build
      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Browser behavior and accessibility tests
        run: bun run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
